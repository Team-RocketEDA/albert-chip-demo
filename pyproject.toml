[project]
name = "albert-chip-demo"
version = "0.1.0"
description = "MobileLLM-125M RTL chip demo (Sky130): weight bake, Verilator sims, LibreLane tiles, netlist renders."
readme = "README.md"
license = { text = "MIT" }
requires-python = "==3.12.*"
dependencies = [
  # The engine is a real PyPI package now; no sys.path hacks needed.
  "rocket_engine>=0.0.2b1",
  # Calibrate/analysis helpers (bake.py itself is pure stdlib).
  "numpy>=1.26",
  # Fetch script uses the `hf` CLI (huggingface_hub[cli]).
  "huggingface_hub[cli]>=0.23",
  # Tile stitching / macro abutment (roadmap step: tiles/ assembly).
  "gdsfactory>=9.51,<10",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["architecture/tests"]
